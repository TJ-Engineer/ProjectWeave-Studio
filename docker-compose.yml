version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: issuetracker-backend
    ports:
      - "3002:5000"
    volumes:
      - ./backend:/app
      - issue-data:/app/instance
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
    networks:
      - issuetracker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: issuetracker-frontend
    ports:
      - "3003:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - issuetracker-network

volumes:
  issue-data:
    driver: local

networks:
  issuetracker-network:
    driver: bridge
