services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-knowledge}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-replace-object-storage-secret}
    volumes:
      - object-storage-data:/data

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment: &app-environment
      DATABASE_URL: postgres://knowledge:${POSTGRES_PASSWORD:-knowledge}@postgres:5432/knowledge
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me-now}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}
      PORT: 3100
      HOSTNAME: 0.0.0.0
      ENABLE_DEVELOPMENT_LOGIN: ${ENABLE_DEVELOPMENT_LOGIN:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.test}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-development-password}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ["npm", "run", "db:seed"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    environment: *app-environment
    ports:
      - "3100:3100"
    depends_on:
      seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  object-storage-data:
