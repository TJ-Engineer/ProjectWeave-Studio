services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-storage:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"vibe-knowledge","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Write"]}]}'
        "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" > /tmp/s3.json;
        exec weed server -s3 -dir=/data -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-knowledge}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-replace-object-storage-secret}
    volumes:
      - object-storage-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://$$(hostname -i):9333/cluster/status >/dev/null && nc -z $$(hostname -i) 8333",
        ]
      interval: 5s
      timeout: 3s
      start_period: 25s
      retries: 20

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment: &app-environment
      DATABASE_URL: postgres://knowledge:${POSTGRES_PASSWORD:-knowledge}@postgres:5432/knowledge
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me-now}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}
      PORT: 3100
      HOSTNAME: 0.0.0.0
      ENABLE_DEVELOPMENT_LOGIN: ${ENABLE_DEVELOPMENT_LOGIN:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.test}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-development-password}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://object-storage:8333}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-knowledge}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-knowledge}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-replace-object-storage-secret}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ["npm", "run", "db:seed"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build: .
    environment: *app-environment
    ports:
      - "3100:3100"
    depends_on:
      seed:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  object-storage-data:
