name: vibe-jira

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql://vibe:vibe-development-only@postgres:5432/vibe_jira}
  SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me-now}
  DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@vibe.local}
  DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-vibe-development-only}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibe_jira}
      POSTGRES_USER: ${POSTGRES_USER:-vibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibe-development-only}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vibe} -d ${POSTGRES_DB:-vibe_jira}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build: .
    command: ["npm", "run", "db:seed"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build: .
    environment:
      <<: *app-environment
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: vibe_jira_test
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe -d vibe_jira_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  migrate-test:
    build:
      context: .
      target: build
    profiles: ["test"]
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://vibe:test-only@postgres-test:5432/vibe_jira_test
    depends_on:
      postgres-test:
        condition: service_healthy

  test:
    build:
      context: .
      target: build
    profiles: ["test"]
    command: ["npm", "run", "test:integration"]
    environment:
      DATABASE_URL: postgresql://vibe:test-only@postgres-test:5432/vibe_jira_test
      TEST_DATABASE_URL: postgresql://vibe:test-only@postgres-test:5432/vibe_jira_test
    depends_on:
      migrate-test:
        condition: service_completed_successfully

volumes:
  postgres-data:
